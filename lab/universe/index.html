<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>宇宙實驗 · WebGPU</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #cfd8ea; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #ui { position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px)); padding: 14px 16px; border-radius: 14px; background: rgba(8, 12, 24, .62); border: 1px solid rgba(160, 190, 255, .16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; line-height: 1.5; transition: opacity .25s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; color: #eaf0ff; letter-spacing: .04em; }
  #stat { color: #8fa0c4; font-variant-numeric: tabular-nums; margin-bottom: 10px; min-height: 1.5em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  button, select { font: inherit; color: inherit; background: rgba(120, 150, 255, .1); border: 1px solid rgba(160, 190, 255, .22); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:hover, select:hover { background: rgba(120, 150, 255, .2); }
  button.on { background: rgba(120, 160, 255, .38); border-color: rgba(190, 210, 255, .55); color: #fff; }
  label.sl { display: grid; grid-template-columns: 4.2em 1fr 2.6em; align-items: center; gap: 8px; margin-bottom: 4px; color: #9fb0d4; }
  label.sl output { text-align: right; font-variant-numeric: tabular-nums; color: #7d8db0; }
  input[type=range] { width: 100%; accent-color: #7f9cff; }
  .hint { margin-top: 10px; font-size: 12px; color: #6b7a9c; }
  #toggle { position: fixed; top: 12px; right: 12px; opacity: .55; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; line-height: 1.8; font-size: 15px; background: #05070d; }
  #msg.show { display: grid; }
  #msg code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>WebGPU 宇宙實驗</h1>
  <div id="stat">載入中…</div>
  <div class="row" id="presets"></div>
  <div class="row">
    <label>星星數 <select id="count"></select></label>
    <button id="restart" title="R">重新開始</button>
    <button id="pause" title="空白鍵">暫停</button>
  </div>
  <label class="sl">時間流速 <input id="speed" type="range" min="1" max="30" step="1" value="4"><output></output></label>
  <label class="sl">亮度 <input id="exposure" type="range" min="0.3" max="3" step="0.05" value="1.2"><output></output></label>
  <label class="sl">光暈 <input id="bloom" type="range" min="0" max="3" step="0.05" value="1"><output></output></label>
  <label><input id="auto" type="checkbox" checked> 鏡頭自動緩慢旋轉</label>
  <div class="hint">拖曳旋轉 · 滾輪／雙指縮放 · 空白鍵暫停 · R 重來 · 1–4 切換場景 · H 隱藏面板</div>
</div>
<button id="toggle" title="H">面板</button>

<div id="msg"></div>

<script type="module">
// ───────────────────────── 常數（JS 與 WGSL 共用）─────────────────────────
const EPS = 0.06;        // 核心重力軟化長度
const HALO = 0.35;       // 暗物質暈強度（相對核心質量）
const RH = 0.5;          // 暗物質暈核心半徑
const RC = 3.0;          // 暗物質暈截斷半徑
const DT = 0.0025;       // 模擬時間步長
const CORE_EPS = 0.12;   // 星系核心互相吸引的軟化長度
const DF_K = 0.1, DF_R = 1.6;   // 動力學摩擦的強度與作用範圍
const F = (x) => Number(x).toFixed(7);

// ───────────────────────── WGSL ─────────────────────────
const SIM_WGSL = /* wgsl */`
struct Particle { pos: vec4f, vel: vec4f };
struct Core { pos: vec4f, vel: vec4f };
struct Sim { dt: f32, steps: u32, count: u32, ncores: u32, cores: array<Core, 4> };

@group(0) @binding(0) var<storage, read_write> parts: array<Particle>;
@group(0) @binding(1) var<uniform> sim: Sim;

const EPS2: f32 = ${F(EPS * EPS)};
const HALO: f32 = ${F(HALO)};
const RH2: f32 = ${F(RH * RH)};
const RC4: f32 = ${F(RC ** 4)};

fn accel(p: vec3f, t: f32) -> vec3f {
  var a = vec3f(0.0);
  for (var c = 0u; c < sim.ncores; c++) {
    let core = sim.cores[c];
    let d = core.pos.xyz + core.vel.xyz * t - p;
    let r2 = dot(d, d);
    let s2 = r2 + EPS2;
    let m = core.pos.w;
    a += d * (m * inverseSqrt(s2 * s2 * s2));
    a += d * (HALO * m / (r2 + RH2) / (1.0 + r2 * r2 / RC4));
  }
  return a;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let i = id.x;
  if (i >= sim.count) { return; }
  let pr = parts[i];
  var p = pr.pos.xyz;
  var v = pr.vel.xyz;
  let dt = sim.dt;
  for (var k = 0u; k < sim.steps; k++) {
    let t = f32(k) * dt;
    v += accel(p, t) * (0.5 * dt);
    p += v * dt;
    v += accel(p, t + dt) * (0.5 * dt);
  }
  parts[i].pos = vec4f(p, pr.pos.w);
  parts[i].vel = vec4f(v, pr.vel.w);
}`;

const PARTICLE_WGSL = /* wgsl */`
struct Particle { pos: vec4f, vel: vec4f };
struct Cam { vp: mat4x4f, p: vec4f };   // p = (解析度x, 解析度y, 星點大小px, 亮度)

@group(0) @binding(0) var<storage, read> parts: array<Particle>;
@group(0) @binding(1) var<uniform> cam: Cam;

struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) uv: vec2f,
  @location(1) col: vec3f,
};

fn palette(t: f32) -> vec3f {
  let warm = vec3f(1.0, 0.52, 0.2);
  let mid = vec3f(1.0, 0.93, 0.84);
  let cool = vec3f(0.42, 0.62, 1.0);
  return select(mix(warm, mid, t * 2.0), mix(mid, cool, t * 2.0 - 1.0), t > 0.5);
}

@vertex
fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  var corners = array<vec2f, 6>(
    vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
    vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0));
  let pt = parts[ii];
  let c = corners[vi];
  let clip = cam.vp * vec4f(pt.pos.xyz, 1.0);
  let s = fract(pt.vel.w * 1000.0);
  let s2 = fract(pt.vel.w * 77.0);
  var col = palette(clamp(pt.pos.w, 0.0, 1.0));
  var gain = cam.p.w * (0.55 + 0.9 * s2);
  var size = cam.p.z * (0.75 + 0.5 * s);
  if (s < 0.02) {                       // 少數粉紅色的恆星形成區
    col = vec3f(1.0, 0.3, 0.58);
    gain = gain * 2.2;
    size = size * 1.8;
  }
  var out: VOut;
  out.pos = vec4f(clip.xy + c * size * 2.0 / cam.p.xy * clip.w, clip.z, clip.w);
  out.uv = c;
  out.col = col * gain;
  return out;
}

@fragment
fn fs(in: VOut) -> @location(0) vec4f {
  let r2 = dot(in.uv, in.uv);
  if (r2 > 1.0) { discard; }
  let g = exp(-r2 * 4.0);
  return vec4f(in.col * g, 1.0);
}`;

const FULLSCREEN_VS = /* wgsl */`
@vertex
fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const DOWN_WGSL = FULLSCREEN_VS + /* wgsl */`
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var smp: sampler;

@fragment
fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let sd = vec2f(textureDimensions(src));
  let dd = max(floor(sd * 0.5), vec2f(1.0));
  let uv = fc.xy / dd;
  let ts = 1.0 / sd;
  var c = textureSampleLevel(src, smp, uv + vec2f(-ts.x, -ts.y), 0.0).rgb;
  c += textureSampleLevel(src, smp, uv + vec2f( ts.x, -ts.y), 0.0).rgb;
  c += textureSampleLevel(src, smp, uv + vec2f(-ts.x,  ts.y), 0.0).rgb;
  c += textureSampleLevel(src, smp, uv + vec2f( ts.x,  ts.y), 0.0).rgb;
  return vec4f(c * 0.25, 1.0);
}`;

const COMPOSITE_WGSL = FULLSCREEN_VS + /* wgsl */`
struct Comp { a: vec4f, right: vec4f, up: vec4f, fwd: vec4f, p: vec4f };
@group(0) @binding(0) var hdr: texture_2d<f32>;
@group(0) @binding(1) var smp: sampler;
@group(0) @binding(2) var<uniform> u: Comp;

fn h1(p: vec3f) -> f32 { return fract(sin(dot(p, vec3f(12.9898, 78.233, 37.719))) * 43758.5453); }

fn vnoise(p: vec3f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);
  let a = mix(mix(h1(i), h1(i + vec3f(1.0, 0.0, 0.0)), w.x),
              mix(h1(i + vec3f(0.0, 1.0, 0.0)), h1(i + vec3f(1.0, 1.0, 0.0)), w.x), w.y);
  let b = mix(mix(h1(i + vec3f(0.0, 0.0, 1.0)), h1(i + vec3f(1.0, 0.0, 1.0)), w.x),
              mix(h1(i + vec3f(0.0, 1.0, 1.0)), h1(i + vec3f(1.0, 1.0, 1.0)), w.x), w.y);
  return mix(a, b, w.z);
}

fn fbm(p: vec3f) -> f32 {
  var a = 0.5;
  var q = p;
  var s = 0.0;
  for (var k = 0; k < 4; k++) {
    s += a * vnoise(q);
    q = q * 2.03 + vec3f(1.7, 9.2, 3.1);
    a *= 0.5;
  }
  return s;
}

fn starLayer(dir: vec3f, scale: f32, thr: f32, pa: f32) -> vec3f {
  let ip = floor(dir * scale);
  if (h1(ip) < thr) { return vec3f(0.0); }
  let ctr = ip + 0.15 + 0.7 * vec3f(h1(ip + 3.1), h1(ip + 9.7), h1(ip + 23.9));
  let d = length(dir - normalize(ctr));
  let r = 1.5 * pa;
  let m = 1.0 - smoothstep(0.0, r, d);
  let b = pow(h1(ip + 5.5), 6.0) * 1.6 + 0.12;
  let tint = mix(vec3f(1.0, 0.75, 0.55), vec3f(0.62, 0.76, 1.0), h1(ip + 8.8));
  return tint * (m * m * b);
}

@fragment
fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let res = u.a.xy;
  let uv = fc.xy / res;
  let hdrc = textureSampleLevel(hdr, smp, uv, 0.0).rgb;
  let bl = textureSampleLevel(hdr, smp, uv, 2.0).rgb * 0.30
         + textureSampleLevel(hdr, smp, uv, 3.0).rgb * 0.22
         + textureSampleLevel(hdr, smp, uv, 4.0).rgb * 0.14
         + textureSampleLevel(hdr, smp, uv, 5.0).rgb * 0.08;

  // 背景：依鏡頭方向算出的星空與星雲，會跟著轉動
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  let dir = normalize(u.fwd.xyz + u.right.xyz * (ndc.x * u.a.z * res.x / res.y) + u.up.xyz * (ndc.y * u.a.z));
  let pa = 2.0 * u.a.z / res.y;
  var sky = starLayer(dir, 38.0, 0.45, pa) * 0.7 + starLayer(dir, 85.0, 0.7, pa) * 0.45;
  let n1 = fbm(dir * 2.2 + 5.0);
  let n2 = fbm(dir * 4.1 - 3.0);
  let band = exp(-pow(dot(dir, normalize(vec3f(0.3, 0.9, 0.3))) * 2.6, 2.0));
  sky += vec3f(0.36, 0.17, 0.56) * smoothstep(0.38, 0.85, n1) * 0.075 * (0.35 + band);
  sky += vec3f(0.08, 0.3, 0.46) * smoothstep(0.45, 0.9, n2) * 0.06 * (0.3 + band);
  sky += vec3f(0.01, 0.015, 0.03);

  var col = (hdrc + bl * u.p.y + sky) * u.p.x;
  col = vec3f(1.0) - exp(-col);
  col = pow(col, vec3f(1.0 / 2.2));
  col *= 1.0 - 0.32 * dot(ndc, ndc) * 0.5;
  col += (h1(vec3f(fc.xy, u.a.w)) - 0.5) / 255.0;
  return vec4f(col, 1.0);
}`;

// ───────────────────────── 小工具 ─────────────────────────
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const msg = $('msg');
function fail(html) { msg.innerHTML = '<div>' + html + '</div>'; msg.classList.add('show'); $('ui').classList.add('hidden'); }

const randn = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const norm3 = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function mul4(a, b) { // column-major
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}

// ───────────────────────── 場景（星系）生成 ─────────────────────────
const vcirc = (r, m) => {
  const r2 = r * r, s2 = r2 + EPS * EPS;
  return Math.sqrt(r2 * (m / (s2 * Math.sqrt(s2)) + HALO * m / (r2 + RH * RH) / (1 + r2 * r2 / RC ** 4)));
};

function fillGalaxy(buf, start, n, g) {
  const { m, size, pos, vel, yaw = 0, pitch = 0, spin = 1, arms = 2, armFrac = 0.6, bulge = 0.12, hot = false, rmin = 0.04 } = g;
  const Rmax = 1.5 * size, h = 0.3 * size, Rb = 0.17 * size;
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const rot = (x, y, z) => { const y1 = y * cp - z * sp, z1 = y * sp + z * cp; return [x * cy + z1 * sy, y1, -x * sy + z1 * cy]; };
  for (let k = 0; k < n; k++) {
    const o = (start + k) * 8;
    let x, y, z, vx, vy, vz, t;
    if (Math.random() < bulge) {
      // 核球：Plummer 分布的球狀星群
      const r = Math.min(Rb / Math.sqrt(Math.pow(Math.random() + 1e-6, -2 / 3) - 1), Rmax * 0.8);
      const d = norm3([randn(), randn(), randn()]);
      x = d[0] * r; y = d[1] * r * 0.8; z = d[2] * r;
      let tv = [randn(), randn(), randn()];
      const dp = dot3(tv, d); tv = norm3([tv[0] - dp * d[0], tv[1] - dp * d[1], tv[2] - dp * d[2]]);
      const s = vcirc(Math.max(r, 0.02), m) * (0.5 + 0.3 * Math.random());
      vx = tv[0] * s; vy = tv[1] * s; vz = tv[2] * s;
      t = hot ? 0.9 : 0.05 + 0.25 * Math.random();
    } else {
      // 盤面：指數分布的半徑 + 對數螺旋臂
      let r; do { r = -h * (Math.log(1 - Math.random()) + Math.log(1 - Math.random())); } while (r > Rmax);
      r = Math.max(r, rmin);
      let th = Math.random() * 2 * Math.PI;
      if (!hot && Math.random() < armFrac) {
        const arm = Math.floor(Math.random() * arms);
        th = arm * 2 * Math.PI / arms - spin * 2.6 * Math.log(1 + r / (0.2 * size)) + randn() * (0.16 + 0.14 * r / Rmax);
      }
      const vc = vcirc(r, m) * (1 + 0.04 * randn());
      const c = Math.cos(th), s = Math.sin(th);
      x = r * c; z = r * s; y = randn() * (0.008 + 0.02 * r / Rmax) * size * (hot ? 0.3 : 1);
      vx = -spin * s * vc + randn() * 0.02 * vc;
      vz = spin * c * vc + randn() * 0.02 * vc;
      vy = randn() * 0.02 * vc;
      t = hot ? 1 - Math.pow(r / Rmax, 0.55) + randn() * 0.04 : 0.32 + 0.68 * Math.min(1, 1.1 * r / Rmax) + randn() * 0.05;
    }
    const P = rot(x, y, z), V = rot(vx, vy, vz);
    buf[o] = P[0] + pos[0]; buf[o + 1] = P[1] + pos[1]; buf[o + 2] = P[2] + pos[2]; buf[o + 3] = clamp(t, 0, 1);
    buf[o + 4] = V[0] + vel[0]; buf[o + 5] = V[1] + vel[1]; buf[o + 6] = V[2] + vel[2]; buf[o + 7] = Math.random();
  }
}

const TRIO = [0, 1, 2].map((i) => {
  const a = Math.PI / 2 + i * 2 * Math.PI / 3, R = 2.4, v = 0.25;
  return { w: 1, m: 0.7, size: 0.75, pos: [R * Math.cos(a), (i - 1) * 0.25, R * Math.sin(a)], vel: [-Math.sin(a) * v, 0, Math.cos(a) * v],
           yaw: i * 1.7, pitch: 0.6 - i * 0.7, spin: i === 1 ? -1 : 1 };
});

const PRESETS = {
  collide: { name: '星系碰撞', dist: 7.5, gal: [
    { w: 0.55, m: 1.0, size: 1.0, pos: [-2.2, 0.2, 0], vel: [0.3, 0, 0.1], yaw: 0.2, pitch: 0.5, spin: 1 },
    { w: 0.45, m: 0.8, size: 0.9, pos: [2.2, -0.2, 0.3], vel: [-0.3, 0, -0.1], yaw: 1.0, pitch: -0.9, spin: 1 } ] },
  spiral: { name: '螺旋星系', dist: 3.8, gal: [
    { w: 1, m: 1.0, size: 1.25, pos: [0, 0, 0], vel: [0, 0, 0], yaw: 0, pitch: 0.95, arms: 2, armFrac: 0.7, bulge: 0.14 } ] },
  trio: { name: '三星系共舞', dist: 8.5, gal: TRIO },
  quasar: { name: '黑洞吸積盤', dist: 2.2, gal: [
    { w: 1, m: 3.0, size: 0.4, pos: [0, 0, 0], vel: [0, 0, 0], yaw: 0, pitch: 0.38, hot: true, bulge: 0.04, rmin: 0.1 } ] },
};

function buildScene(key, N) {
  const P = PRESETS[key];
  const buf = new Float32Array(N * 8);
  const wsum = P.gal.reduce((s, g) => s + g.w, 0);
  let start = 0;
  P.gal.forEach((g, i) => {
    const n = i === P.gal.length - 1 ? N - start : Math.floor(N * g.w / wsum);
    fillGalaxy(buf, start, n, g);
    start += n;
  });
  const cores = P.gal.map((g) => ({ p: [...g.pos], v: [...g.vel], m: g.m }));
  return { buf, cores, dist: P.dist };
}

function stepCores(cores, total) {
  const n = 6, h = total / n;
  const acc = () => cores.map((a) => {
    const r = [0, 0, 0];
    for (const b of cores) if (b !== a) {
      const d = [b.p[0] - a.p[0], b.p[1] - a.p[1], b.p[2] - a.p[2]];
      const d2 = dot3(d, d), s2 = d2 + CORE_EPS * CORE_EPS, k = b.m / (s2 * Math.sqrt(s2));
      r[0] += d[0] * k; r[1] += d[1] * k; r[2] += d[2] * k;
      // 簡化的動力學摩擦：星系暈重疊時相對速度會被消耗，兩個星系才會真的合併
      const f = -DF_K * b.m * Math.exp(-d2 / (DF_R * DF_R));
      for (let j = 0; j < 3; j++) r[j] += f * (a.v[j] - b.v[j]);
    }
    return r;
  });
  for (let s = 0; s < n; s++) {
    let a = acc();
    cores.forEach((c, i) => { for (let j = 0; j < 3; j++) c.v[j] += a[i][j] * h / 2; });
    cores.forEach((c) => { for (let j = 0; j < 3; j++) c.p[j] += c.v[j] * h; });
    a = acc();
    cores.forEach((c, i) => { for (let j = 0; j < 3; j++) c.v[j] += a[i][j] * h / 2; });
  }
}

// ───────────────────────── 初始化 WebGPU ─────────────────────────
async function main() {
  if (!navigator.gpu) {
    return fail('這個瀏覽器不支援 WebGPU。<br>請用較新的 <code>Chrome</code> / <code>Edge</code>（113 以上）或 <code>Safari 26</code>，並確認是透過 https 或 localhost 開啟。');
  }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) return fail('找不到可用的 GPU 介面卡（WebGPU adapter）。');
  const device = await adapter.requestDevice();
  const gpuName = adapter.info?.description || adapter.info?.device || adapter.info?.vendor || 'GPU';
  device.lost.then((i) => fail('GPU 裝置遺失：' + i.message + '<br>重新整理頁面試試。'));
  let errShown = false;
  device.addEventListener('uncapturederror', (e) => {
    console.error(e.error.message);
    if (!errShown) { errShown = true; fail('WebGPU 錯誤：<br><code>' + String(e.error.message).replace(/</g, '&lt;').slice(0, 400) + '</code>'); }
  });

  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  const HDR = 'rgba16float';
  const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });

  const simPipe = device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code: SIM_WGSL }), entryPoint: 'main' } });
  const partMod = device.createShaderModule({ code: PARTICLE_WGSL });
  const additive = { color: { srcFactor: 'one', dstFactor: 'one', operation: 'add' }, alpha: { srcFactor: 'one', dstFactor: 'one', operation: 'add' } };
  const partPipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: partMod, entryPoint: 'vs' },
    fragment: { module: partMod, entryPoint: 'fs', targets: [{ format: HDR, blend: additive }] },
    primitive: { topology: 'triangle-list' },
  });
  const downMod = device.createShaderModule({ code: DOWN_WGSL });
  const downPipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: downMod, entryPoint: 'vs' },
    fragment: { module: downMod, entryPoint: 'fs', targets: [{ format: HDR }] },
  });
  const compMod = device.createShaderModule({ code: COMPOSITE_WGSL });
  const compPipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: compMod, entryPoint: 'vs' },
    fragment: { module: compMod, entryPoint: 'fs', targets: [{ format }] },
  });

  const simUBO = device.createBuffer({ size: 16 + 4 * 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const camUBO = device.createBuffer({ size: 80, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const compUBO = device.createBuffer({ size: 80, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const simDV = new DataView(new ArrayBuffer(16 + 4 * 32));

  // ── UI 狀態 ──
  const state = { preset: 'collide', N: 500000, paused: false, speed: 4, exposure: 1.2, bloom: 1, auto: true };
  const COUNTS = [100000, 250000, 500000, 1000000, 2000000, 4000000];
  $('count').innerHTML = COUNTS.map((n) => `<option value="${n}"${n === state.N ? ' selected' : ''}>${n >= 1e6 ? n / 1e6 + ' M' : n / 1e3 + ' k'}</option>`).join('');
  const presetBox = $('presets');
  Object.entries(PRESETS).forEach(([k, p], i) => {
    const b = document.createElement('button');
    b.textContent = `${i + 1} ${p.name}`; b.dataset.k = k; presetBox.appendChild(b);
  });
  const syncPresetBtns = () => presetBox.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.k === state.preset));
  for (const id of ['speed', 'exposure', 'bloom']) {
    const el = $(id), out = el.parentElement.querySelector('output');
    const upd = () => { state[id] = +el.value; out.textContent = el.value; };
    el.addEventListener('input', upd); upd();
  }
  $('auto').addEventListener('change', (e) => { state.auto = e.target.checked; });

  // ── 場景緩衝 ──
  let partBuf = null, partBG = null, simBG = null, cores = [], N = state.N;
  const cam = { yaw: 0.6, pitch: 0.5, dist: 7.5, target: [0, 0, 0] };

  function loadScene() {
    N = state.N;
    const sc = buildScene(state.preset, N);
    partBuf?.destroy();
    partBuf = device.createBuffer({ size: sc.buf.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, mappedAtCreation: true });
    new Float32Array(partBuf.getMappedRange()).set(sc.buf);
    partBuf.unmap();
    simBG = device.createBindGroup({ layout: simPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: partBuf } }, { binding: 1, resource: { buffer: simUBO } }] });
    partBG = device.createBindGroup({ layout: partPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: partBuf } }, { binding: 1, resource: { buffer: camUBO } }] });
    cores = sc.cores;
    cam.dist = sc.dist;
    cam.target = com();
    syncPresetBtns();
  }
  function com() {
    const M = cores.reduce((s, c) => s + c.m, 0);
    return [0, 1, 2].map((j) => cores.reduce((s, c) => s + c.p[j] * c.m, 0) / M);
  }

  presetBox.addEventListener('click', (e) => { const k = e.target.dataset?.k; if (k) { state.preset = k; loadScene(); } });
  $('count').addEventListener('change', (e) => { state.N = +e.target.value; loadScene(); });
  $('restart').addEventListener('click', loadScene);
  const pauseBtn = $('pause');
  const togglePause = () => { state.paused = !state.paused; pauseBtn.textContent = state.paused ? '繼續' : '暫停'; pauseBtn.classList.toggle('on', state.paused); };
  pauseBtn.addEventListener('click', togglePause);
  const toggleUI = () => $('ui').classList.toggle('hidden');
  $('toggle').addEventListener('click', toggleUI);
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') loadScene();
    else if (e.key === 'h' || e.key === 'H') toggleUI();
    else if (/^[1-9]$/.test(e.key)) { const k = Object.keys(PRESETS)[+e.key - 1]; if (k) { state.preset = k; loadScene(); } }
  });

  // ── 鏡頭操作 ──
  const ptrs = new Map(); let pinch = 0, lastTouch = 0;
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); lastTouch = performance.now(); });
  canvas.addEventListener('pointermove', (e) => {
    const prev = ptrs.get(e.pointerId); if (!prev) return;
    const cur = [e.clientX, e.clientY];
    if (ptrs.size === 1) {
      cam.yaw -= (cur[0] - prev[0]) * 0.005;
      cam.pitch = clamp(cam.pitch + (cur[1] - prev[1]) * 0.005, -1.5, 1.5);
    }
    ptrs.set(e.pointerId, cur);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch) cam.dist = clamp(cam.dist * pinch / d, 0.4, 80);
      pinch = d;
    }
    lastTouch = performance.now();
  });
  const up = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0011), 0.4, 80); }, { passive: false });

  // ── 隨視窗大小重建的資源 ──
  let W = 0, H = 0, scale = 1, hdrTex = null, mipViews = [], downBGs = [], compBG = null;
  function resize() {
    scale = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(64, Math.round(canvas.clientWidth * scale)), h = Math.max(64, Math.round(canvas.clientHeight * scale));
    if (w === W && h === H) return;
    W = w; H = h; canvas.width = w; canvas.height = h;
    hdrTex?.destroy();
    const mips = Math.min(6, Math.floor(Math.log2(Math.max(w, h))) + 1);
    hdrTex = device.createTexture({ size: [w, h], format: HDR, mipLevelCount: mips, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    mipViews = Array.from({ length: mips }, (_, i) => hdrTex.createView({ baseMipLevel: i, mipLevelCount: 1 }));
    downBGs = mipViews.slice(0, -1).map((v) => device.createBindGroup({ layout: downPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: v }, { binding: 1, resource: sampler }] }));
    compBG = device.createBindGroup({ layout: compPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: hdrTex.createView() }, { binding: 1, resource: sampler }, { binding: 2, resource: { buffer: compUBO } }] });
  }

  // ── 每一幀 ──
  const FOV = 55 * Math.PI / 180, TAN = Math.tan(FOV / 2);
  let fps = 60, last = performance.now(), statT = 0;
  loadScene();

  function frame(now) {
    requestAnimationFrame(frame);
    const dtReal = Math.min(100, now - last); last = now;
    fps += (1000 / Math.max(dtReal, 0.1) - fps) * 0.05;
    resize();

    if (state.auto && ptrs.size === 0 && now - lastTouch > 2500) cam.yaw += 0.0007;
    const com3 = com();
    for (let j = 0; j < 3; j++) cam.target[j] += (com3[j] - cam.target[j]) * 0.08;

    // 相機
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const eye = [cam.target[0] + cam.dist * cp * Math.sin(cam.yaw), cam.target[1] + cam.dist * sp, cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)];
    const fwd = norm3([cam.target[0] - eye[0], cam.target[1] - eye[1], cam.target[2] - eye[2]]);
    const right = norm3(cross3(fwd, [0, 1, 0]));
    const upv = cross3(right, fwd);
    const view = new Float32Array([right[0], upv[0], -fwd[0], 0, right[1], upv[1], -fwd[1], 0, right[2], upv[2], -fwd[2], 0, -dot3(right, eye), -dot3(upv, eye), dot3(fwd, eye), 1]);
    const f = 1 / TAN, zn = 0.01, zf = 500, asp = W / H;
    const proj = new Float32Array([f / asp, 0, 0, 0, 0, f, 0, 0, 0, 0, zf / (zn - zf), -1, 0, 0, zn * zf / (zn - zf), 0]);
    const vp = mul4(proj, view);

    const gain = 0.014 * (500000 / N);
    device.queue.writeBuffer(camUBO, 0, new Float32Array([...vp, W, H, 1.7 * scale, gain]));
    device.queue.writeBuffer(compUBO, 0, new Float32Array([W, H, TAN, now * 0.001, ...right, 0, ...upv, 0, ...fwd, 0, state.exposure, state.bloom, 0, 0]));

    // 模擬
    simDV.setFloat32(0, DT, true); simDV.setUint32(4, state.speed, true); simDV.setUint32(8, N, true); simDV.setUint32(12, cores.length, true);
    cores.forEach((c, i) => {
      const o = 16 + i * 32;
      simDV.setFloat32(o, c.p[0], true); simDV.setFloat32(o + 4, c.p[1], true); simDV.setFloat32(o + 8, c.p[2], true); simDV.setFloat32(o + 12, c.m, true);
      simDV.setFloat32(o + 16, c.v[0], true); simDV.setFloat32(o + 20, c.v[1], true); simDV.setFloat32(o + 24, c.v[2], true);
    });
    device.queue.writeBuffer(simUBO, 0, simDV.buffer);

    const enc = device.createCommandEncoder();
    if (!state.paused) {
      const p = enc.beginComputePass();
      p.setPipeline(simPipe); p.setBindGroup(0, simBG); p.dispatchWorkgroups(Math.ceil(N / 64)); p.end();
    }
    {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: mipViews[0], clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'store' }] });
      p.setPipeline(partPipe); p.setBindGroup(0, partBG); p.draw(6, N); p.end();
    }
    for (let i = 0; i < downBGs.length; i++) {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: mipViews[i + 1], loadOp: 'clear', clearValue: [0, 0, 0, 1], storeOp: 'store' }] });
      p.setPipeline(downPipe); p.setBindGroup(0, downBGs[i]); p.draw(3); p.end();
    }
    {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', clearValue: [0, 0, 0, 1], storeOp: 'store' }] });
      p.setPipeline(compPipe); p.setBindGroup(0, compBG); p.draw(3); p.end();
    }
    device.queue.submit([enc.finish()]);

    if (!state.paused) stepCores(cores, state.speed * DT);

    if (now - statT > 400) {
      statT = now;
      $('stat').textContent = `${N >= 1e6 ? (N / 1e6).toFixed(1) + ' M' : N / 1e3 + ' k'} 顆星 · ${fps.toFixed(0)} FPS · ${gpuName}`;
    }
  }
  requestAnimationFrame(frame);
}

main().catch((e) => { console.error(e); fail('初始化失敗：<br><code>' + String(e.message || e).replace(/</g, '&lt;') + '</code>'); });
</script>
</body>
</html>
